<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الحياة - حركة واضحة وسلسة</title>
<style>
:root {
  --bg: #05020d;
  --primary: #ff3377;
  --gold: #ffcc00;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.game-container {
  position: relative;
  width: min(100vw, 960px);
  height: min(100vh, 540px);
  aspect-ratio: 16/9;
  box-shadow: 0 0 60px rgba(255, 51, 119, 0.4);
  border: 3px solid #3d1c6d;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
}
canvas { width: 100%; height: 100%; display: block; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(5, 2, 13, 0.94);
  backdrop-filter: blur(10px);
  z-index: 100; gap: 16px; text-align: center; padding: 24px;
}
.title {
  font-size: 34px; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 20px rgba(255, 204, 0, 0.6), 2px 2px 0 var(--primary);
}
.subtitle { font-size: 17px; color: #ffe6f0; max-width: 82%; line-height: 1.5; }
input#nin {
  width: 290px; padding: 12px; font-size: 18px; font-weight: bold;
  text-align: center; background: #180d38; color: #fff;
  border: 2px solid var(--primary); border-radius: 8px; outline: none;
}
button.btn {
  padding: 14px 40px; font-size: 20px; font-weight: 900;
  color: #05020d; background: linear-gradient(135deg, var(--gold), #ff9900);
  border: none; border-radius: 10px; cursor: pointer;
  box-shadow: 0 5px 20px rgba(255, 204, 0, 0.5);
  transition: transform 0.1s ease;
}
button.btn:active { transform: scale(0.95); }

#hud {
  position: absolute; top: 15px; left: 20px; right: 20px;
  display: none; justify-content: space-between; align-items: center;
  z-index: 40; pointer-events: none; font-weight: 900; font-size: 18px;
}
.hud-item {
  background: rgba(15, 5, 30, 0.85); padding: 8px 18px;
  border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div class="game-container">
  <canvas id="gc" width="960" height="540"></canvas>

  <div id="hud">
    <div class="hud-item" id="stage-txt">المرحلة 1: السباحة في قناة فالوب</div>
    <div class="hud-item" id="score-txt">النقاط: 0</div>
  </div>

  <div id="start-screen" class="overlay">
    <div class="title">رحلة الحياة السينمائية 🎬</div>
    <div class="subtitle">حركة واضحة ورؤية مكشوفة بالكامل للأمام! وجه مسارك لمراوغة القنابل والانغراس في الرحم وصولاً للفيلم الختامي.</div>
    <input id="nin" maxlength="20" placeholder="أدخل اسمك الكريم" value="بطل الرحلة">
    <button class="btn" onclick="startFlow()">ابدأ الرحلة السينمائية</button>
  </div>

  <div id="fail-screen" class="overlay" style="display:none;">
    <div class="title" style="color:#ff3333;">لم تكتمل الرحلة!</div>
    <div class="subtitle">اصطدمت بإحدى العقبات. حاول مجدداً بحركة أكثر سلاسة!</div>
    <button class="btn" onclick="restartFlow()">إعادة المحاولة</button>
  </div>

  <div id="end-screen" class="overlay" style="display:none;">
    <div class="title">تهانينا! اكتملت المعجزة 🎉</div>
    <button class="btn" onclick="location.reload()">لعب مرة أخرى</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

let gameState = 0; // 0: Menu, 1: Tunnel, 2: Implantation, 3: Hearts, 4: Film, 5: GameOver
let score = 0, heartsScore = 0, stage = 1, gameTime = 0;

// Ship / Reticle Controls (Clear View)
const player = { x: 480, y: 270, tx: 480, ty: 270 };
let tunnelOffset = 0;

let obstacles = [], hearts = [], speedLines = [], endTimer = 0;
let targetWall = { x: 480, y: 130, radius: 60 };

for(let i=0; i<30; i++) {
  speedLines.push({ x: Math.random() * 960, y: Math.random() * 540, z: Math.random() * 1000 });
}

function startFlow() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  gameState = 1;
}

function restartFlow() {
  document.getElementById('fail-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  player.x = 480; player.y = 270; player.tx = 480; player.ty = 270;
  score = 0; heartsScore = 0; stage = 1; obstacles = []; hearts = [];
  gameState = 1;
}

// Smooth Touch / Pointer Control
canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  player.tx = (e.clientX - rect.left) * (canvas.width / rect.width);
  player.ty = (e.clientY - rect.top) * (canvas.height / rect.height);
});

function update() {
  gameTime++;

  // Smooth Movement
  player.x += (player.tx - player.x) * 0.2;
  player.y += (player.ty - player.y) * 0.2;

  if (gameState === 1) {
    score++;
    document.getElementById('score-txt').innerText = `المسافة: ${Math.floor(score/10)}m`;
    tunnelOffset += 0.05;

    // Spawn Clear Obstacles from Distance
    if (gameTime % Math.max(15, 38 - stage * 6) === 0) {
      const type = Math.random() > 0.4 ? 'bomb' : 'monster';
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 180;
      obstacles.push({
        x: 480 + Math.cos(angle) * dist,
        y: 270 + Math.sin(angle) * dist,
        z: 1000, type, radius: type === 'bomb' ? 24 : 30, rot: 0
      });
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      let ob = obstacles[i];
      ob.z -= 20 + stage * 4;
      ob.rot += 0.04;

      // Check Collision with Player Position
      if (ob.z < 80 && ob.z > 0) {
        let dx = (ob.x - 480) * (400 / ob.z) + 480;
        let dy = (ob.y - 270) * (400 / ob.z) + 270;
        if (Math.hypot(player.x - dx, player.y - dy) < ob.radius + 15) {
          gameState = 5;
          document.getElementById('hud').style.display = 'none';
          document.getElementById('fail-screen').style.display = 'flex';
        }
      }
      if (ob.z <= 0) obstacles.splice(i, 1);
    }

    if (score === 450 && stage === 1) {
      stage = 2;
      document.getElementById('stage-txt').innerText = "المرحلة 2: الانقسامات الخلوية المتتابعة";
    } else if (score >= 950 && stage === 2) {
      gameState = 2;
      document.getElementById('stage-txt').innerText = "المرحلة 3: التثبيت والانغراس في الجدار الصحيح!";
    }
  }

  if (gameState === 2) {
    let dist = Math.hypot(player.x - targetWall.x, player.y - targetWall.y);
    if (dist < targetWall.radius) {
      gameState = 3;
      obstacles = [];
      document.getElementById('stage-txt').innerText = "المرحلة 4: نمو الجنين وجمع القلوب ❤️";
      document.getElementById('score-txt').innerText = `النقاط: 0 ❤️`;
    }
  }

  if (gameState === 3) {
    if (gameTime % 20 === 0) {
      hearts.push({
        x: Math.random() * 840 + 60,
        y: Math.random() * 420 + 60,
        size: 18, pulse: 0
      });
    }

    for (let i = hearts.length - 1; i >= 0; i--) {
      let h = hearts[i];
      h.pulse += 0.12;
      if (Math.hypot(player.x - h.x, player.y - h.y) < h.size + 20) {
        heartsScore += 10;
        document.getElementById('score-txt').innerText = `النقاط: ${heartsScore} ❤️`;
        hearts.splice(i, 1);
      }
    }

    if (heartsScore < 50) document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 4 (تكون المضغة)";
    else if (heartsScore < 120) document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 12 (تشكل الوجه والأطراف)";
    else if (heartsScore < 200) document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 20 (نبضات القلب القوية)";
    else if (heartsScore >= 260) {
      document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 36 (اكتمل النمو تماماً 🎉)";
      setTimeout(() => {
        if (gameState === 3) {
          gameState = 4; endTimer = 0;
          document.getElementById('hud').style.display = 'none';
        }
      }, 800);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === 1) {
    // Tunnel Background
    let grad = ctx.createRadialGradient(480, 270, 10, 480, 270, 500);
    grad.addColorStop(0, '#3d0a2b');
    grad.addColorStop(0.6, '#180313');
    grad.addColorStop(1, '#05020d');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Speed Lines
    ctx.strokeStyle = 'rgba(255, 200, 230, 0.2)';
    speedLines.forEach(l => {
      l.z -= 25; if (l.z <= 0) l.z = 1000;
      let sc = 400 / l.z;
      ctx.beginPath();
      ctx.moveTo((l.x - 480)*sc + 480, (l.y - 270)*sc + 270);
      ctx.lineTo((l.x - 480)*(sc*1.2) + 480, (l.y - 270)*(sc*1.2) + 270);
      ctx.stroke();
    });

    // Draw Clear Obstacles
    obstacles.forEach(ob => {
      let scale = 400 / ob.z;
      let sx = (ob.x - 480) * scale + 480;
      let sy = (ob.y - 270) * scale + 270;
      let sz = ob.radius * scale;

      if (sz > 1) {
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(ob.rot);

        if (ob.type === 'bomb') {
          // Sharp Red Bomb with White Outline
          ctx.fillStyle = '#ff1a1a';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          // Spikes
          ctx.fillStyle = '#ffcc00';
          for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
            ctx.beginPath(); ctx.arc(Math.cos(a) * sz, Math.sin(a) * sz, 4 * scale, 0, Math.PI * 2); ctx.fill();
          }
        } else {
          // Purple Monster with Glowing Outline
          ctx.fillStyle = '#a800ff';
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      }
    });

    // Clear Crosshair/Pointer (NO YELLOW BLOB BLOCKING VISION)
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 16, 0, Math.PI * 2);
    ctx.stroke();
    // Cross lines
    ctx.beginPath();
    ctx.moveTo(player.x - 8, player.y); ctx.lineTo(player.x + 8, player.y);
    ctx.moveTo(player.x, player.y - 8); ctx.lineTo(player.x, player.y + 8);
    ctx.stroke();
  }

  // Implantation View
  if (gameState === 2) {
    ctx.fillStyle = '#1f0315'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#7a1443'; ctx.fillRect(0, 0, canvas.width, 160);

    let spotGrad = ctx.createRadialGradient(targetWall.x, targetWall.y, 5, targetWall.x, targetWall.y, targetWall.radius);
    spotGrad.addColorStop(0, '#ffcc00');
    spotGrad.addColorStop(1, 'rgba(0,255,170,0.3)');
    ctx.fillStyle = spotGrad;
    ctx.beginPath(); ctx.arc(targetWall.x, targetWall.y, targetWall.radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();

    // Clear Reticle
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, 16, 0, Math.PI*2); ctx.stroke();
  }

  // Collecting Hearts Stage
  if (gameState === 3) {
    ctx.fillStyle = '#140210'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    hearts.forEach(h => {
      ctx.save();
      ctx.translate(h.x, h.y);
      let sc = 1 + Math.sin(h.pulse) * 0.2;
      ctx.scale(sc, sc);

      ctx.fillStyle = '#ff0066';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-7, -7, 9, Math.PI, 0);
      ctx.arc(7, -7, 9, Math.PI, 0);
      ctx.lineTo(0, 12);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    });

    // Fetus Light Reticle
    ctx.strokeStyle = '#ff3388'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, 20, 0, Math.PI*2); ctx.stroke();
  }

  // 🎬 Film Stage
  if (gameState === 4) {
    endTimer++;
    drawShortFilm(endTimer);
  }
}

// 2D Film Render
function drawShortFilm(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (t < 1100) {
    ctx.fillStyle = '#fceade'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    draw2DParent(320, 200, '#2b4c7e', '#f0c8a0', true);
    draw2DParent(640, 210, '#b84260', '#f0c8a0', false);

    let open = Math.min(1, t / 350);
    let lid = (1 - open) * (canvas.height / 2);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, lid);
    ctx.fillRect(0, canvas.height - lid, canvas.width, lid);
  }
  else if (t < 2500) {
    ctx.fillStyle = '#eaf7ff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#61b85c'; ctx.fillRect(0, 420, canvas.width, 120);

    let progress = (t - 1100) / 1400;
    let babyX = 200 + progress * 200;

    draw2DParent(650, 280, '#b84260', '#f0c8a0', false);
    draw2DParent(730, 270, '#2b4c7e', '#f0c8a0', true);
    draw2DChild(babyX, 360, Math.sin(t * 0.12) * 12);
  }
  else if (t < 3700) {
    ctx.fillStyle = '#151028'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    draw2DGrownTeen(480, 240);
  }
  else {
    ctx.fillStyle = '#05020d'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#17102e';
    for(let i=0; i<4; i++) ctx.fillRect(0, 120 + i*45, canvas.width, 35);

    let spot = ctx.createRadialGradient(480, 180, 20, 480, 180, 220);
    spot.addColorStop(0, 'rgba(255, 230, 120, 0.95)');
    spot.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = spot;
    ctx.beginPath(); ctx.arc(480, 180, 220, 0, Math.PI*2); ctx.fill();

    draw2DParent(440, 120, '#2b4c7e', '#f0c8a0', true, true);
    draw2DParent(520, 125, '#b84260', '#f0c8a0', false, true);
    draw2DGrownTeen(480, 360);

    if (t > 5000) {
      document.getElementById('end-screen').style.display = 'flex';
    }
  }
}

function draw2DParent(x, y, shirtColor, skinColor, isDad, isClapping=false) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = skinColor;
  ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = isDad ? '#331a00' : '#4a2000';
  ctx.beginPath(); ctx.arc(0, -5, 27, Math.PI, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#663300'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 4, 11, 0, Math.PI); ctx.stroke();

  ctx.fillStyle = '#221100';
  ctx.beginPath(); ctx.arc(-9, -2, 3.5, 0, Math.PI*2); ctx.arc(9, -2, 3.5, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = shirtColor;
  ctx.beginPath(); ctx.roundRect(-24, 25, 48, 72, 12); ctx.fill();

  ctx.strokeStyle = skinColor; ctx.lineWidth = 8;
  if (isClapping) {
    let armMove = Math.sin(gameTime * 0.35) * 12;
    ctx.beginPath(); ctx.moveTo(-20, 32); ctx.lineTo(-4 + armMove, 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20, 32); ctx.lineTo(4 - armMove, 16); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-20, 32); ctx.lineTo(-32, 72); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20, 32); ctx.lineTo(32, 72); ctx.stroke();
  }

  ctx.restore();
}

function draw2DChild(x, y, legOffset) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-6, -1, 2.5, 0, Math.PI*2); ctx.arc(6, -1, 2.5, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ff3388';
  ctx.beginPath(); ctx.roundRect(-14, 18, 28, 38, 8); ctx.fill();

  ctx.strokeStyle = '#f0c8a0'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-7, 54); ctx.lineTo(-7 + legOffset, 74); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, 54); ctx.lineTo(7 - legOffset, 74); ctx.stroke();

  ctx.restore();
}

function draw2DGrownTeen(x, y) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#111';
  ctx.fillRect(-28, -30, 56, 10);
  ctx.fillRect(-14, -44, 28, 14);

  ctx.fillStyle = '#ff3377';
  ctx.beginPath(); ctx.roundRect(-22, 24, 44, 85, 10); ctx.fill();

  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
