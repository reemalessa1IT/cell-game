<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>رحلتك بعلم الأجنة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body, html {
  width: 100%; height: 100%; overflow: hidden;
  background: #0d0118; color: #fff;
  font-family: 'Cairo', system-ui, sans-serif;
}
#game-container {
  position: relative; width: 100vw; height: 100vh;
  display: flex; justify-content: center; align-items: center;
  background: radial-gradient(circle at center, #2a0845 0%, #0d0118 100%);
}
canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }

/* تصميم الشاشات التفاعلية العصرية */
.screen-overlay {
  position: absolute; inset: 0; z-index: 100;
  background: rgba(13, 1, 24, 0.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px; text-align: center; padding: 25px;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

.screen-overlay h1 {
  font-size: 38px; font-weight: 900; color: #ffeaa7;
  text-shadow: 0 0 20px rgba(255, 234, 167, 0.5), 3px 3px 0 #e84393;
  line-height: 1.2;
}
.screen-overlay p {
  font-size: 20px; color: #dfe6e9; max-width: 520px; line-height: 1.7;
}

/* الأزرار الكرتونية الحديثة */
.btn-glow {
  background: linear-gradient(135deg, #ff7675, #d63031);
  border: 3px solid #fff; border-radius: 50px;
  color: #fff; font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 24px;
  padding: 14px 48px; cursor: pointer;
  box-shadow: 0 10px 25px rgba(214, 48, 49, 0.5), inset 0 2px 0 rgba(255,255,255,0.4);
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.btn-glow:hover { transform: scale(1.06) translateY(-2px); box-shadow: 0 15px 30px rgba(214, 48, 49, 0.7); }
.btn-glow:active { transform: scale(0.96) translateY(2px); }

.btn-green {
  background: linear-gradient(135deg, #00b894, #006b54);
  box-shadow: 0 10px 25px rgba(0, 184, 148, 0.5);
}

/* الحاوية البصرية لشخصيات التحذير */
.chars-preview {
  display: flex; gap: 30px; margin: 10px 0; align-items: center; justify-content: center;
}
.char-card {
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px; padding: 15px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.char-card canvas { position: relative; width: 120px; height: 130px; }

/* واجهة الأزرار العلوية أثناء اللعب */
.game-ui {
  position: absolute; top: 20px; left: 20px; right: 20px; z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
.brand-title {
  font-size: 24px; font-weight: 900; color: #ffeaa7;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.ui-btns { display: flex; gap: 12px; pointer-events: auto; }
.icon-btn {
  background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px);
  border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 14px;
  color: #fff; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 16px;
  padding: 8px 18px; cursor: pointer; transition: 0.2s;
}
.icon-btn:hover { background: rgba(255,255,255,0.3); }
</style>
</head>
<body>

<div id="game-container">
  <!-- الكانفاس الرئيسي -->
  <canvas id="gameCanvas"></canvas>

  <!-- أزرار الواجهة العليا أثناء اللعب -->
  <div class="game-ui">
    <div class="brand-title">رحلة علم الأجنة 🧬</div>
    <div class="ui-btns">
      <button class="icon-btn" id="pauseBtn">إيقاف ⏸</button>
      <button class="icon-btn" id="muteBtn">الصوت: مفعل 🔊</button>
    </div>
  </div>

  <!-- الشاشة 1: ابدأ رحلتك بعلم الأجنة -->
  <div id="screenStart" class="screen-overlay">
    <h1>ابدأ رحلتك بعلم الأجنة</h1>
    <p>انغمس داخل العالم المجهري المدهش للخلايا الأجسنية وشاهد المعجزات الخلوية عن قرب!</p>
    <button class="btn-glow" id="btnStart">ابدأ الرحلة 🚀</button>
  </div>

  <!-- الشاشة 2: شاشة التحذير للشخصيات الكرتونية النفاثة بالقبعات البيضاء -->
  <div id="screenWarning" class="screen-overlay" style="display: none;">
    <h1>تحذير من الفريق الطبي! ⚠️</h1>
    <div class="chars-preview">
      <div class="char-card"><canvas id="previewBoy" width="120" height="130"></canvas></div>
      <div class="char-card"><canvas id="previewGirl" width="120" height="130"></canvas></div>
    </div>
    <p>انتبه أيها الباحث! المسار مليء بالفيروسات والأجسام الخلوية الدخيلة.<br>حافظ على طاقة الـ ATP واففز لتفادي المخاطر!</p>
    <button class="btn-glow btn-green" id="btnGoPlay">انطلق الآن! 🧬</button>
  </div>

  <!-- الشاشة 3: نهاية المحاولة -->
  <div id="screenGameOver" class="screen-overlay" style="display: none;">
    <h1>انتهت المحاولة!</h1>
    <p id="scoreText" style="font-size: 26px; color: #ffeaa7; font-weight: 900;"></p>
    <button class="btn-glow" id="btnRestart">إعادة اللعب 🔄</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// إدارة الصوت
let mute = false;
let audioCtx = null;
function playSound(freq, duration, type = 'sine') {
  if (mute) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

// حالات اللعبة

let score = 0, lives = 3, frame = 0, isPaused = false;

  vy: 0, gravity: 0.6, jumpPower: -13.5,
  isGrounded: false
};

let obstacles = [];
let collectibles = [];
let bgParticles = [];

// توليد الجزيئات العائمة في الخلفية
for (let i = 0; i < 35; i++) {
  bgParticles.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 4 + 2, speed: Math.random() * 1.5 + 0.5,
    opacity: Math.random() * 0.5 + 0.2
  });
}
