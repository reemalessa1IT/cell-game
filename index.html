<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- منع المتصفح من حفظ الكاش القديم لضمان عمل التحديثات مباشرة -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>رحلتك بعلم الأجنة - index</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
  width: 100%; height: 100%; overflow: hidden;
  background-color: #12041d; color: #ffffff;
  font-family: system-ui, -apple-system, sans-serif; user-select: none;
}
#game-container {
  position: relative; width: 100vw; height: 100vh;
  display: flex; justify-content: center; align-items: center;
}
canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }

/* شاشات البداية والتحذير والنهاية */
.screen-overlay {
  position: absolute; inset: 0; z-index: 999;
  background: rgba(18, 4, 29, 0.98);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; text-align: center; padding: 20px;
}
.screen-overlay h1 { font-size: 34px; color: #ffde59; margin: 0; text-shadow: 2px 2px #ff3366; }
.screen-overlay p { font-size: 18px; color: #e2d8f0; max-width: 450px; line-height: 1.6; margin: 0; }

.btn {
  background: #ff3366; border: 3px solid #fff; border-radius: 12px;
  color: #fff; font-weight: bold; font-size: 22px; padding: 12px 35px;
  cursor: pointer; box-shadow: 0 4px 0 #990033;
}
.btn:active { transform: translateY(3px); box-shadow: none; }

.chars-row { display: flex; gap: 20px; margin: 10px 0; }
.chars-row canvas { width: 110px; height: 110px; background: rgba(255,255,255,0.08); border-radius: 12px; }

/* واجهة اللعبة أثناء اللعب */
.game-ui {
  position: absolute; top: 15px; left: 15px; right: 15px; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
.top-title { font-size: 22px; font-weight: bold; color: #ffde59; }
.control-btns { display: flex; gap: 10px; pointer-events: auto; }
.sm-btn { background: #ff3366; border: 2px solid #fff; color: #fff; border-radius: 8px; padding: 6px 14px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div id="game-container">
  <!-- كانفاس اللعبة -->
  <canvas id="mainCanvas"></canvas>

  <!-- واجهة أزرار التحكم في اللعب -->
  <div class="game-ui">
    <div class="top-title">رحلة علم الأجنة 🧬</div>
    <div class="control-btns">
      <button class="sm-btn" id="pauseBtn">إيقاف</button>
      <button class="sm-btn" id="muteBtn">الصوت: مفعل</button>
    </div>
  </div>

  <!-- الشاشة 1: ابدأ رحلتك بعلم الأجنة -->
  <div id="screenStart" class="screen-overlay">
    <h1>ابدأ رحلتك بعلم الأجنة</h1>
    <p>استكشف عالم الخلايا المجهري وتخطَّ العقبات بنجاح!</p>
    <button class="btn" id="btnStartGame">ابدأ</button>
  </div>

  <!-- الشاشة 2: شاشة التحذير للشخصيات بالنفاث والقبعات البيضاء -->
  <div id="screenWarning" class="screen-overlay" style="display: none;">
    <h1>تحذير من الفريق الطبي! ⚠️</h1>
    <div class="chars-row">
      <canvas id="cBoy" width="110" height="110"></canvas>
      <canvas id="cGirl" width="110" height="110"></canvas>
    </div>
    <p>احذر! الطريق مليء بالفيروسات والعقبات الخلوية.<br>اقفز لتفاديها واجمع جزيئات الطاقة للوصول بسلام!</p>
    <button class="btn" id="btnGoPlay" style="background:#00b894; box-shadow:0 4px 0 #006b54;">انطلق الآن! 🚀</button>
  </div>

  <!-- الشاشة 3: نهاية اللعبة -->
  <div id="screenGameOver" class="screen-overlay" style="display: none;">
    <h1>انتهت المحاولة!</h1>
    <p id="finalScore" style="font-size: 22px; color: #ffde59;"></p>
    <button class="btn" id="btnRestart">إعادة اللعب 🔄</button>
  </div>
</div>

<script>
const cv = document.getElementById('mainCanvas');
const g = cv.getContext('2d');

let W = cv.width = window.innerWidth;
let H = cv.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
});

let mute = false;
let AC = null;
function sound(f, d, ty='square') {
  if (mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), n = AC.createGain(), a = AC.currentTime;
    o.type = ty; o.frequency.value = f;
    n.gain.setValueAtTime(0.05, a);
    n.gain.exponentialRampToValueAtTime(0.001, a + d);
    o.connect(n); o.connect(AC.destination);
    o.start(); o.stop(a + d);
  } catch (e) {}
}

let gameState = 'START'; 
let score = 0, lives = 3, frameCount = 0, isPaused = false;
const groundY = () => H * 0.78;

const player = { x: 100, y: 0, w: 50, h: 65, vy: 0, gravity: 0.65, jumpPower: -14, isGrounded: false };
let obstacles = [], collectibles = [];

// رسم الشخصيات بالحقائب النفاثة والقبعات البيضاء
function drawJetpackCharacter(ctx, x, y, isGirl = false) {
  ctx.save();
  ctx.translate(x, y);

  // نار الحقيبة النفاثة
  ctx.fillStyle = Math.random() > 0.5 ? '#ff7675' : '#fdcb6e';
  ctx.beginPath();
  ctx.moveTo(-18, 12); ctx.lineTo(-12, 28 + Math.random()*6); ctx.lineTo(-6, 12);
  ctx.fill();

  // الحقيبة
  ctx.fillStyle = '#7f8c8d'; ctx.fillRect(-20, -8, 10, 22);

  // الجسم
  ctx.fillStyle = isGirl ? '#e84393' : '#0984e3';
  ctx.beginPath(); ctx.roundRect(-6, -8, 20, 24, 5); ctx.fill();

  // الرأس
  ctx.fillStyle = '#ffeaa7';
  ctx.beginPath(); ctx.arc(4, -18, 12, 0, Math.PI * 2); ctx.fill();

  // القبعة البيضاء
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(4, -22, 13, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillRect(-8, -24, 24, 4);

  // العيون
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(8, -18, 2, 0, Math.PI * 2);
  ctx.arc(13, -18, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function renderWarningChars() {
  const c1 = document.getElementById('cBoy').getContext('2d');
  const c2 = document.getElementById('cGirl').getContext('2d');
  c1.clearRect(0, 0, 110, 110); c2.clearRect(0, 0, 110, 110);
  drawJetpackCharacter(c1, 55, 60, false);
  drawJetpackCharacter(c2, 55, 60, true);
}

// أزرار الضغط مع ربط مباشر ومضمون
document.getElementById('btnStartGame').onclick = function() {
  document.getElementById('screenStart').style.display = 'none';
  document.getElementById('screenWarning').style.display = 'flex';
  renderWarningChars();
  gameState = 'WARNING';
};

document.getElementById('btnGoPlay').onclick = function() {
  document.getElementById('screenWarning').style.display = 'none';
  startGameplay();
};

document.getElementById('btnRestart').onclick = function() {
  document.getElementById('screenGameOver').style.display = 'none';
  startGameplay();
};

function startGameplay() {
  score = 0; lives = 3; gameState = 'PLAYING'; isPaused = false;
  player.y = groundY() - player.h; player.vy = 0;
  obstacles = []; collectibles = [];
  obstacles.push({ x: W + 350, y: groundY() - 45, w: 45, h: 45 });
}

document.getElementById('pauseBtn').onclick = function() {
  if (gameState !== 'PLAYING') return;
  isPaused = !isPaused;
  this.innerText = isPaused ? 'استئناف' : 'إيقاف';
};

document.getElementById('muteBtn').onclick = function() {
  mute = !mute;
  this.innerText = mute ? 'الصوت: مكتوم' : 'الصوت: مفعل';
};

function doJump() {
  if (gameState === 'PLAYING' && player.isGrounded && !isPaused) {
    player.vy = player.jumpPower; player.isGrounded = false;
    sound(450, 0.1, 'sine');
  }
}

// القفز في اللعبة
window.addEventListener('keydown', (e) => { 
  if (e.code === 'Space' || e.code === 'ArrowUp') doJump(); 
});
cv.addEventListener('pointerdown', () => { if (gameState === 'PLAYING') doJump(); });

function update() {
  if (gameState !== 'PLAYING' || isPaused) return;
  frameCount++;

  player.vy += player.gravity;
  player.y += player.vy;
  if (player.y + player.h >= groundY()) {
    player.y = groundY() - player.h; player.vy = 0; player.isGrounded = true;
  }

  if (frameCount % 170 === 0) {
    obstacles.push({ x: W + 100, y: groundY() - 45, w: 45, h: 45 });
  }
  if (frameCount % 220 === 0) {
    collectibles.push({ x: W + 100, y: groundY() - 90 - Math.random() * 40, r: 14 });
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= 5.5;

    if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
        player.y < obs.y + obs.h && player.y + player.h > obs.y) {
      lives--; sound(150, 0.2, 'sawtooth');
      obstacles.splice(i, 1);
      if (lives <= 0) {
        gameState = 'GAMEOVER';
        document.getElementById('finalScore').innerText = 'النقاط: ' + score;
        document.getElementById('screenGameOver').style.display = 'flex';
      }
      continue;
    }
    if (obs.x + obs.w < 0) { obstacles.splice(i, 1); score += 10; }
  }

  for (let i = collectibles.length - 1; i >= 0; i--) {
    let c = collectibles[i]; c.x -= 5.5;
    let dist = Math.hypot((player.x + player.w/2) - c.x, (player.y + player.h/2) - c.y);
    if (dist < player.w/2 + c.r) {
      score += 25; sound(700, 0.12, 'sine');
      collectibles.splice(i, 1); continue;
    }
    if (c.x + c.r < 0) collectibles.splice(i, 1);
  }
}

function render() {
  g.fillStyle = '#1e0524'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#5c3d99'; g.fillRect(0, groundY(), W, H - groundY());

  g.strokeStyle = '#a29bfe'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(0, groundY());
  for (let x = 0; x <= W; x += 30) {
    g.lineTo(x, groundY() + Math.sin((x + frameCount * 3) * 0.03) * 4);
  }
  g.stroke();

  if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
    collectibles.forEach(c => {
      g.fillStyle = '#fdcb6e'; g.beginPath(); g.arc(c.x, c.y, c.r, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
    });

    obstacles.forEach(o => {
      g.fillStyle = '#e74c3c'; g.beginPath(); g.arc(o.x + o.w/2, o.y + o.h/2, o.w/2, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#ff7675'; g.lineWidth = 3;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
        let sx = (o.x + o.w/2) + Math.cos(a) * (o.w/2);
        let sy = (o.y + o.h/2) + Math.sin(a) * (o.h/2);
        let ex = (o.x + o.w/2) + Math.cos(a) * (o.w/2 + 6);
        let ey = (o.y + o.h/2) + Math.sin(a) * (o.h/2 + 6);
        g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
      }
    });

    drawJetpackCharacter(g, player.x + player.w/2, player.y + 35, false);

    g.fillStyle = '#ffffff'; g.font = 'bold 20px sans-serif';
    g.fillText('النقاط: ' + score, 20, 80);

    for (let i = 0; i < lives; i++) {
      g.fillStyle = '#ff3366';
      let hx = 20 + i * 30, hy = 110;
      g.beginPath(); g.arc(hx - 4, hy, 5, 0, Math.PI * 2); g.arc(hx + 4, hy, 5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(hx - 9, hy + 2); g.lineTo(hx, hy + 11); g.lineTo(hx + 9, hy + 2); g.fill();
    }
  }
}

function loop() { update(); render(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
