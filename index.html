<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلتك بعلم الأجنة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12041d;
  --fg: #ffffff;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: var(--bg);
  color: var(--fg);
  font-family: 'Cairo', Tahoma, sans-serif;
  user-select: none;
}
#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle, #3b0944 0%, #12041d 100%);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
.ui-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  box-sizing: border-box;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: auto;
}
.title {
  font-size: 26px;
  font-weight: 900;
  color: #ffde59;
  text-shadow: 2px 2px 0 #ff3366;
}
.btn-group {
  display: flex;
  gap: 10px;
}
button {
  background: #ff3366;
  border: 3px solid #fff;
  border-radius: 14px;
  color: #fff;
  font-family: 'Cairo', sans-serif;
  font-weight: 900;
  font-size: 18px;
  padding: 10px 24px;
  cursor: pointer;
  box-shadow: 0 5px 0 #990033;
  transition: all 0.1s ease;
  pointer-events: auto;
}
button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #990033;
}

/* الشاشات التفاعلية */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 3, 25, 0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 10;
  pointer-events: auto;
  text-align: center;
  padding: 20px;
}
.overlay h1 {
  font-size: 38px;
  color: #ffde59;
  text-shadow: 3px 3px 0 #ff3366;
  margin: 0;
}
.overlay p {
  font-size: 20px;
  color: #e2d8f0;
  max-width: 500px;
  line-height: 1.6;
  margin: 0;
}
.jetpack-chars {
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
  margin: 10px 0;
}
.jetpack-chars canvas {
  width: 130px;
  height: 130px;
}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="c"></canvas>
  
  <!-- واجهة أزرار التحكم العليا -->
  <div class="ui-layer">
    <div class="top-bar">
      <div class="title">رحلة الخلية 🧬</div>
      <div class="btn-group">
        <button id="pBtn">إيقاف</button>
        <button id="mBtn">الصوت: مفعل</button>
      </div>
    </div>
  </div>

  <!-- 1. الشاشة الأولى: ابدأ رحلتك بعلم الأجنة -->
  <div id="startOverlay" class="overlay">
    <h1>ابدأ رحلتك بعلم الأجنة</h1>
    <p>استكشف عالم الخلايا المجهري وتخطَّ العقبات بنجاح!</p>
    <button id="startBtn" style="font-size: 26px; padding: 12px 40px;">ابدأ</button>
  </div>

  <!-- 2. الشاشة الثانية: الشخصيات الكرتونية بالحقائب النفاثة والقبعات البيضاء تحذرك -->
  <div id="warningOverlay" class="overlay" style="display: none;">
    <h1>تحذير من الفريق الطبي! ⚠️</h1>
    <div class="jetpack-chars">
      <canvas id="char1Canvas" width="130" height="130"></canvas>
      <canvas id="char2Canvas" width="130" height="130"></canvas>
    </div>
    <p>انتبه! الطريق مليء بالفيروسات والعقبات الخلوية.<br>اقفز لتفاديها واجمع جزيئات الطاقة للوصول بأمان!</p>
    <button id="goGameBtn" style="font-size: 24px; padding: 10px 35px; background: #00b894; box-shadow: 0 5px 0 #006b54;">انطلق الآن! 🚀</button>
  </div>

  <!-- 3. شاشة الخسارة -->
  <div id="gameOverOverlay" class="overlay" style="display: none;">
    <h1 id="goTitle">انتهت الرحلة!</h1>
    <p id="goScore" style="font-size: 24px; color: #ffde59;"></p>
    <button id="restartBtn" style="font-size: 22px; padding: 10px 30px;">إعادة المحاولة 🔄</button>
  </div>
</div>

  H = cv.height = window.innerHeight;
});
