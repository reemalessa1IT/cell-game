<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الحياة - كاملة مع جمع القلوب</title>
<style>
:root {
  --bg: #0a051b;
  --primary: #ff4d8d;
  --accent: #ffd6e7;
  --gold: #ffe066;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.game-container {
  position: relative;
  width: min(100vw, 960px);
  height: min(100vh, 540px);
  aspect-ratio: 16/9;
  box-shadow: 0 0 50px rgba(255, 77, 141, 0.3);
  border: 3px solid #2a1b5e;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}
canvas { width: 100%; height: 100%; display: block; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(10, 5, 27, 0.92);
  backdrop-filter: blur(8px);
  z-index: 100; gap: 15px; text-align: center; padding: 20px;
}
.title {
  font-size: 32px; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 15px rgba(255, 224, 102, 0.6), 2px 2px 0 #ff4d8d;
}
.subtitle { font-size: 16px; color: var(--accent); max-width: 80%; }
input#nin {
  width: 280px; padding: 10px; font-size: 18px; font-weight: bold;
  text-align: center; background: #1b1340; color: #fff;
  border: 2px solid var(--primary); border-radius: 8px; outline: none;
}
button.btn {
  padding: 14px 36px; font-size: 20px; font-weight: 900;
  color: #0b0720; background: linear-gradient(135deg, var(--gold), #ffaa00);
  border: none; border-radius: 8px; cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 224, 102, 0.4);
}
button.btn:active { transform: scale(0.96); }

#hud {
  position: absolute; top: 15px; left: 20px; right: 20px;
  display: none; justify-content: space-between; align-items: center;
  z-index: 40; pointer-events: none; font-weight: 900;
}
.hud-item { background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="game-container">
  <canvas id="gc" width="960" height="540"></canvas>

  <div id="hud">
    <div class="hud-item" id="stage-txt">المرحلة 1: الانطلاق في قناة فالوب</div>
    <div class="hud-item" id="score-txt">النقاط: 0 ❤️</div>
  </div>

  <div id="start-screen" class="overlay">
    <div class="title">رحلة الأجنة السينمائية</div>
    <div class="subtitle">انطلق، انغرس في الرحم، واجمع القلوب والنقاط أثناء نمو الجنين حتى اكتمال معجزة الحياة!</div>
    <input id="nin" maxlength="20" placeholder="أدخل اسمك الكريم" value="بطل الرحلة">
    <button class="btn" onclick="startFlow()">ابدأ الرحلة السينمائية</button>
  </div>

  <div id="fail-screen" class="overlay" style="display:none;">
    <div class="title" style="color:#ff4d4d;">لم تكتمل الرحلة!</div>
    <div class="subtitle">اصطدمت بالعقبات قبل الانغراس والنمو. حاول مجدداً!</div>
    <button class="btn" onclick="restartFlow()">إعادة المحاولة</button>
  </div>

  <div id="end-screen" class="overlay" style="display:none;">
    <div class="title">تهانينا! اكتملت معجزة الحياة 🎉</div>
    <button class="btn" onclick="location.reload()">لعب مرة أخرى</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

let gameState = 0; // 0: Menu, 1: Play Tunnel, 2: Implantation, 3: Fetal Growth (Hearts), 4: Film, 5: GameOver
let heartsScore = 0, distanceScore = 0, stage = 1, gameTime = 0;

const camera = { x: 480, y: 270, targetX: 480, targetY: 270 };
let tunnelOffset = 0;

let obstacles = [], hearts = [], speedLines = [], endTimer = 0;
let targetWall = { x: 480, y: 120, radius: 45 };

for(let i=0; i<40; i++) {
  speedLines.push({ x: Math.random() * 960, y: Math.random() * 540, z: Math.random() * 1000 });
}

function startFlow() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  gameState = 1;
}

function restartFlow() {
  document.getElementById('fail-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  camera.x = 480; camera.y = 270;
  heartsScore = 0; distanceScore = 0; stage = 1; obstacles = []; hearts = [];
  gameState = 1;
}

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  camera.targetX = (e.clientX - rect.left) * (canvas.width / rect.width);
  camera.targetY = (e.clientY - rect.top) * (canvas.height / rect.height);
});

function update() {
  gameTime++;

  // 1. Fallopian Tube Stage
  if (gameState === 1) {
    distanceScore++;
    document.getElementById('score-txt').innerText = `المسافة: ${Math.floor(distanceScore/10)}m`;
    tunnelOffset += 0.06;

    camera.x += (camera.targetX - camera.x) * 0.15;
    camera.y += (camera.targetY - camera.y) * 0.15;

    const tunnelCenterX = 480 + Math.sin(tunnelOffset) * 90;
    const tunnelCenterY = 270;

    if (gameTime % Math.max(12, 35 - stage * 6) === 0) {
      const type = Math.random() > 0.4 ? 'bomb' : 'monster';
      const angle = Math.random() * Math.PI * 2;
      obstacles.push({
        x: tunnelCenterX + Math.cos(angle) * (Math.random() * 180),
        y: tunnelCenterY + Math.sin(angle) * (Math.random() * 180),
        z: 1000, type, radius: type === 'bomb' ? 22 : 28
      });
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      let ob = obstacles[i];
      ob.z -= 20 + stage * 4;

      if (ob.z < 60 && ob.z > 0) {
        if (Math.hypot(camera.x - ob.x, camera.y - ob.y) < ob.radius + 15) {
          gameState = 5;
          document.getElementById('hud').style.display = 'none';
          document.getElementById('fail-screen').style.display = 'flex';
        }
      }
      if (ob.z <= 0) obstacles.splice(i, 1);
    }

    if (distanceScore === 500 && stage === 1) {
      stage = 2;
      document.getElementById('stage-txt').innerText = "المرحلة 2: الانقسامات الخلوية المتتابعة";
    } else if (distanceScore >= 1200 && stage === 2) {
      gameState = 2; // Implantation
      document.getElementById('stage-txt').innerText = "المرحلة 3: اثبت في الجدار الصحيح للرحم!";
    }
  }

  // 2. Implantation Zone
  if (gameState === 2) {
    camera.x += (camera.targetX - camera.x) * 0.15;
    camera.y += (camera.targetY - camera.y) * 0.15;

    let dist = Math.hypot(camera.x - targetWall.x, camera.y - targetWall.y);
    if (dist < targetWall.radius) {
      gameState = 3; // Fetal Growth & Collect Hearts
      obstacles = [];
      document.getElementById('stage-txt').innerText = "المرحلة 4: نمو الجنين وجمع القلوب ❤️";
      document.getElementById('score-txt').innerText = `النقاط: 0 ❤️`;
    }
  }

  // 3. Fetal Growth & Collecting Hearts Stage
  if (gameState === 3) {
    camera.x += (camera.targetX - camera.x) * 0.15;
    camera.y += (camera.targetY - camera.y) * 0.15;

    // Spawn Hearts
    if (gameTime % 20 === 0) {
      hearts.push({
        x: Math.random() * 880 + 40,
        y: Math.random() * 460 + 40,
        size: 16,
        pulse: 0
      });
    }

    // Collect Hearts Collision
    for (let i = hearts.length - 1; i >= 0; i--) {
      let h = hearts[i];
      h.pulse += 0.1;
      if (Math.hypot(camera.x - h.x, camera.y - h.y) < h.size + 20) {
        heartsScore += 10;
        document.getElementById('score-txt').innerText = `النقاط: ${heartsScore} ❤️`;
        hearts.splice(i, 1);
      }
    }

    // Fetal Growth Milestones
    if (heartsScore < 50) {
      document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 4 (تكون المضغة)";
    } else if (heartsScore < 120) {
      document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 12 (بداية تشكل الأطراف والوجه)";
    } else if (heartsScore < 200) {
      document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 20 (بداية سماع نبضات القلب)";
    } else if (heartsScore >= 280) {
      document.getElementById('stage-txt').innerText = "نمو الجنين: الأسبوع 36 (اكتمل النمو تماماً 🎉)";
      // Transition to Film
      setTimeout(() => {
        if (gameState === 3) {
          gameState = 4;
          endTimer = 0;
          document.getElementById('hud').style.display = 'none';
        }
      }, 1000);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === 1) {
    const cx = 480 + Math.sin(tunnelOffset) * 90;
    let grad = ctx.createRadialGradient(cx, 270, 20, cx, 270, 500);
    grad.addColorStop(0, '#3a0d2e'); grad.addColorStop(1, '#0a0312');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let r = 500; r > 20; r -= 40) {
      ctx.beginPath();
      ctx.arc(cx, 270, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 77, 141, ${r/1000})`;
      ctx.lineWidth = 3; ctx.stroke();
    }

    obstacles.forEach(ob => {
      let scale = 400 / ob.z;
      let sx = (ob.x - camera.x) * scale + 480;
      let sy = (ob.y - camera.y) * scale + 270;
      let sz = ob.radius * scale;
      if (sz > 0.5) {
        ctx.fillStyle = ob.type === 'bomb' ? '#ff3333' : '#a020f0';
        ctx.beginPath(); ctx.arc(sx, sy, sz, 0, Math.PI * 2); ctx.fill();
      }
    });

    ctx.strokeStyle = 'rgba(255, 224, 102, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(480, 270, 30, 0, Math.PI*2); ctx.stroke();
  }

  // Implantation View
  if (gameState === 2) {
    ctx.fillStyle = '#2b091e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#6b173e'; ctx.fillRect(0, 0, canvas.width, 160);

    let spotGrad = ctx.createRadialGradient(targetWall.x, targetWall.y, 5, targetWall.x, targetWall.y, targetWall.radius);
    spotGrad.addColorStop(0, '#ffe066');
    spotGrad.addColorStop(1, 'rgba(0,255,150,0.2)');
    ctx.fillStyle = spotGrad;
    ctx.beginPath(); ctx.arc(targetWall.x, targetWall.y, targetWall.radius, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(camera.x, camera.y, 16, 0, Math.PI*2); ctx.fill();
  }

  // Fetal Growth Stage (Collecting Hearts inside Uterus)
  if (gameState === 3) {
    ctx.fillStyle = '#1f0718'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Render Hearts
    hearts.forEach(h => {
      ctx.save();
      ctx.translate(h.x, h.y);
      let scale = 1 + Math.sin(h.pulse) * 0.15;
      ctx.scale(scale, scale);
      ctx.fillStyle = '#ff4d8d';
      ctx.beginPath();
      ctx.arc(-6, -6, 8, Math.PI, 0);
      ctx.arc(6, -6, 8, Math.PI, 0);
      ctx.lineTo(0, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // Fetus Glow Representation
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(camera.x, camera.y, 22, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ff73c5'; ctx.lineWidth = 4; ctx.stroke();
  }

  // 🎬 90-SECOND SHORT FILM
  if (gameState === 4) {
    endTimer++;
    drawShortFilm(endTimer);
  }
}

function drawShortFilm(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (t < 1200) {
    ctx.fillStyle = '#fceade'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    draw2DParent(320, 200, '#385a7c', '#f0c8a0', true);
    draw2DParent(640, 210, '#c45b78', '#f0c8a0', false);

    let open = Math.min(1, t / 400);
    let lid = (1 - open) * (canvas.height / 2);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, lid);
    ctx.fillRect(0, canvas.height - lid, canvas.width, lid);
  }
  else if (t < 2700) {
    ctx.fillStyle = '#eaf7ff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#7bc676'; ctx.fillRect(0, 420, canvas.width, 120);

    let progress = (t - 1200) / 1500;
    let babyX = 200 + progress * 200;

    draw2DParent(650, 280, '#c45b78', '#f0c8a0', false);
    draw2DParent(730, 270, '#385a7c', '#f0c8a0', true);
    draw2DChild(babyX, 360, Math.sin(t * 0.1) * 10);
  }
  else if (t < 3900) {
    ctx.fillStyle = '#1c1836'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    draw2DGrownTeen(480, 240);
  }
  else {
    ctx.fillStyle = '#0a0518'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1a1333';
    for(let i=0; i<4; i++) ctx.fillRect(0, 120 + i*45, canvas.width, 35);

    let spot = ctx.createRadialGradient(480, 180, 20, 480, 180, 200);
    spot.addColorStop(0, 'rgba(255, 235, 150, 0.95)');
    spot.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = spot;
    ctx.beginPath(); ctx.arc(480, 180, 200, 0, Math.PI*2); ctx.fill();

    draw2DParent(440, 120, '#385a7c', '#f0c8a0', true, true);
    draw2DParent(520, 125, '#c45b78', '#f0c8a0', false, true);
    draw2DGrownTeen(480, 360);

    if (t > 5200) {
      document.getElementById('end-screen').style.display = 'flex';
    }
  }
}

function draw2DParent(x, y, shirtColor, skinColor, isDad, isClapping=false) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = skinColor;
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = isDad ? '#3d2314' : '#5a2d0c';
  ctx.beginPath(); ctx.arc(0, -5, 26, Math.PI, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#804020'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 4, 10, 0, Math.PI); ctx.stroke();

  ctx.fillStyle = '#402010';
  ctx.beginPath(); ctx.arc(-8, -2, 3, 0, Math.PI*2); ctx.arc(8, -2, 3, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = shirtColor;
  ctx.beginPath(); ctx.roundRect(-22, 24, 44, 70, 10); ctx.fill();

  ctx.strokeStyle = skinColor; ctx.lineWidth = 8;
  if (isClapping) {
    let armMove = Math.sin(gameTime * 0.3) * 10;
    ctx.beginPath(); ctx.moveTo(-20, 30); ctx.lineTo(-5 + armMove, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20, 30); ctx.lineTo(5 - armMove, 15); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-20, 30); ctx.lineTo(-30, 70); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20, 30); ctx.lineTo(30, 70); ctx.stroke();
  }

  ctx.restore();
}

function draw2DChild(x, y, legOffset) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-5, -1, 2, 0, Math.PI*2); ctx.arc(5, -1, 2, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ff8fc7';
  ctx.beginPath(); ctx.roundRect(-12, 16, 24, 35, 6); ctx.fill();

  ctx.strokeStyle = '#f0c8a0'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-6, 50); ctx.lineTo(-6 + legOffset, 70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, 50); ctx.lineTo(6 - legOffset, 70); ctx.stroke();

  ctx.restore();
}

function draw2DGrownTeen(x, y) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#111';
  ctx.fillRect(-25, -28, 50, 8);
  ctx.fillRect(-12, -40, 24, 12);

  ctx.fillStyle = '#ff4d8d';
  ctx.beginPath(); ctx.roundRect(-20, 22, 40, 80, 8); ctx.fill();

  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
