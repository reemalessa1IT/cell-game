<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>رحلتك بعلم الأجنة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body, html {
  width: 100%; height: 100%; overflow: hidden;
  background: #0d0118; color: #fff;
  font-family: 'Cairo', system-ui, sans-serif;
}
#game-container {
  position: relative; width: 100vw; height: 100vh;
  display: flex; justify-content: center; align-items: center;
  background: radial-gradient(circle at center, #2a0845 0%, #0d0118 100%);
}
canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }

/* الشاشات التفاعلية فوق اللعبة */
.screen-overlay {
  position: absolute; inset: 0; z-index: 9999;
  background: rgba(13, 1, 24, 0.94);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px; text-align: center; padding: 25px;
  pointer-events: auto !important;
}

.screen-overlay h1 {
  font-size: 38px; font-weight: 900; color: #ffeaa7;
  text-shadow: 0 0 20px rgba(255, 234, 167, 0.5), 3px 3px 0 #e84393;
  line-height: 1.2;
}
.screen-overlay p {
  font-size: 20px; color: #dfe6e9; max-width: 520px; line-height: 1.7;
}

/* الأزرار الكرتونية الحديثة */
.btn-glow {
  background: linear-gradient(135deg, #ff7675, #d63031);
  border: 3px solid #fff; border-radius: 50px;
  color: #fff; font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 24px;
  padding: 14px 48px; cursor: pointer;
  box-shadow: 0 10px 25px rgba(214, 48, 49, 0.5);
  transition: transform 0.1s;
  pointer-events: auto !important;
  position: relative; z-index: 10000;
}
.btn-glow:active { transform: scale(0.95); }

.btn-green {
  background: linear-gradient(135deg, #00b894, #006b54);
  box-shadow: 0 10px 25px rgba(0, 184, 148, 0.5);
}

.chars-preview {
  display: flex; gap: 25px; margin: 10px 0; align-items: center; justify-content: center;
}
.char-card {
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px; padding: 15px;
}
.char-card canvas { position: relative; width: 120px; height: 130px; z-index: 2; }

/* أزرار الواجهة أثناء اللعب */
.game-ui {
  position: absolute; top: 20px; left: 20px; right: 20px; z-index: 500;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
.brand-title {
  font-size: 24px; font-weight: 900; color: #ffeaa7;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.ui-btns { display: flex; gap: 12px; pointer-events: auto; }
.icon-btn {
  background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px);
  border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 14px;
  color: #fff; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 16px;
  padding: 8px 18px; cursor: pointer;
}
</style>
</head>
<body>

<div id="game-container">
  <!-- الكانفاس الرئيسي -->
  <canvas id="gameCanvas"></canvas>

  <!-- أزرار الواجهة العليا -->
  <div class="game-ui">
    <div class="brand-title">رحلة علم الأجنة 🧬</div>
    <div class="ui-btns">
      <button class="icon-btn" onclick="togglePause(event)">إيقاف ⏸</button>
      <button class="icon-btn" onclick="toggleMute(event)">الصوت: مفعل 🔊</button>
    </div>
  </div>

  <!-- الشاشة 1: ابدأ رحلتك بعلم الأجنة -->
  <div id="screenStart" class="screen-overlay">
    <h1>ابدأ رحلتك بعلم الأجنة</h1>
    <p>انغمس داخل العالم المجهري المدهش للخلايا الأجنة وشاهد المعجزات الخلوية عن قرب!</p>
    <button class="btn-glow" onclick="handleStartClick(event)">ابدأ الرحلة 🚀</button>
  </div>

  <!-- الشاشة 2: شاشة التحذير -->
  <div id="screenWarning" class="screen-overlay" style="display: none;">
    <h1>تحذير من الفريق الطبي! ⚠️</h1>
    <div class="chars-preview">
      <div class="char-card"><canvas id="previewBoy" width="120" height="130"></canvas></div>
      <div class="char-card"><canvas id="previewGirl" width="120" height="130"></canvas></div>
    </div>
    <p>انتبه أيها الباحث! المسار مليء بالفيروسات والأجسام الخلوية الدخيلة.<br>حافظ على طاقة الـ ATP واففز لتفادي المخاطر!</p>
    <button class="btn-glow btn-green" onclick="handlePlayClick(event)">انطلق الآن! 🧬</button>
  </div>

  <!-- الشاشة 3: نهاية المحاولة -->
  <div id="screenGameOver" class="screen-overlay" style="display: none;">
    <h1>انتهت المحاولة!</h1>
    <p id="scoreText" style="font-size: 26px; color: #ffeaa7; font-weight: 900;"></p>
    <button class="btn-glow" onclick="handleRestartClick(event)">إعادة اللعب 🔄</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// إدارة الصوت
let mute = false;
let audioCtx = null;
function playSound(freq, duration, type = 'sine') {
  if (mute) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

let gameState = 'START'; // START, WARNING, PLAYING, GAMEOVER
let score = 0, lives = 3, frame = 0, isPaused = false;
const getGroundY = () => H * 0.76;

  x: 120, y: 0, w: 60, h: 75,
  vy: 0, gravity: 0.6, jumpPower: -13.5,
  isGrounded: false
};

let obstacles = [];
let collectibles = [];
let bgParticles = [];

for (let i = 0; i < 30; i++) {
  bgParticles.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 4 + 2, speed: Math.random() * 1.5 + 0.5,
    opacity: Math.random() * 0.5 + 0.2
  });
}

  c.translate(x, y);

  let flameSize = 10 + Math.random() * 8;
  let flameGrad = c.createLinearGradient(-16, 15, -16, 15 + flameSize);
  flameGrad.addColorStop(0, '#fdcb6e'); flameGrad.addColorStop(1, '#e17055');
  c.fillStyle = flameGrad;
  c.beginPath();
  c.moveTo(-22, 15); c.lineTo(-16, 15 + flameSize); c.lineTo(-10, 15);
  c.fill();

  // النفاثة
  c.fillStyle = '#636e72'; c.beginPath(); c.roundRect(-25, -12, 14, 28, 6); c.fill();
  c.fillStyle = '#00cec9'; c.beginPath(); c.arc(-18, -2, 3, 0, Math.PI*2); c.fill();

  // الجسم
  c.fillStyle = isGirl ? '#fd79a8' : '#74b9ff';
  c.beginPath(); c.roundRect(-10, -10, 26, 28, 10); c.fill();

  // الرأس
  c.fillStyle = '#ffeaa7';
  c.beginPath(); c.arc(3, -22, 16, 0, Math.PI * 2); c.fill();

  if (isGirl) {
    c.fillStyle = '#e17055';
    c.beginPath(); c.arc(-5, -22, 17, Math.PI*0.5, Math.PI*1.8); c.fill();
  }

  // القبعة البيضاء الطبية
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(3, -28, 16, Math.PI, Math.PI * 2); c.fill();
  c.fillStyle = '#dfe6e9';
  c.fillRect(-12, -30, 30, 4);
  c.fillStyle = '#ff7675';
  c.fillRect(1, -38, 4, 8); c.fillRect(-1, -36, 8, 4);

  // العيون والابتسامة
  c.fillStyle = '#2d3436';
  c.beginPath(); c.
