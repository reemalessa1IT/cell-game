<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلتك بعلم الأجنة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
  width: 100%; height: 100%; overflow: hidden;
  background-color: #12041d; color: #ffffff;
  font-family: 'Cairo', sans-serif; user-select: none;
}
#game-container {
  position: relative; width: 100vw; height: 100vh;
  display: flex; justify-content: center; align-items: center;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* طبقة الأزرار العليا */
.ui-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; padding: 20px; z-index: 10;
}
.top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
.title { font-size: 26px; font-weight: 900; color: #ffde59; text-shadow: 2px 2px 0 #ff3366; }

button {
  background: #ff3366; border: 3px solid #fff; border-radius: 12px;
  color: #fff; font-family: 'Cairo', sans-serif; font-weight: 900;
  font-size: 18px; padding: 10px 24px; cursor: pointer;
  box-shadow: 0 4px 0 #990033; pointer-events: auto; position: relative; z-index: 101;
}
button:active { transform: translateY(3px); box-shadow: none; }

/* الشاشات التفاعلية فوق اللعبة */
.overlay {
  position: absolute; inset: 0;
  background: rgba(18, 4, 29, 0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; z-index: 100; text-align: center; padding: 20px; pointer-events: auto;
}
.overlay h1 { font-size: 36px; color: #ffde59; text-shadow: 2px 2px 0 #ff3366; }
.overlay p { font-size: 20px; color: #e2d8f0; max-width: 500px; line-height: 1.6; }
.jetpack-container { display: flex; gap: 20px; margin: 10px 0; }
.jetpack-container canvas { width: 120px; height: 120px; background: rgba(255,255,255,0.05); border-radius: 15px; }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="c"></canvas>

  <div class="ui-layer">
    <div class="top-bar">
      <div class="title">رحلة علم الأجنة 🧬</div>
      <div>
        <button id="pBtn" type="button">إيقاف</button>
        <button id="mBtn" type="button">الصوت: مفعل</button>
      </div>
    </div>
  </div>

  <!-- الشاشة 1: ابدأ رحلتك بعلم الأجنة -->
  <div id="startOverlay" class="overlay">
    <h1>ابدأ رحلتك بعلم الأجنة</h1>
    <p>استكشف عالم الخلايا المجهري وتخطَّ العقبات بنجاح!</p>
    <button id="startBtn" type="button" style="font-size: 26px; padding: 12px 40px;">ابدأ</button>
  </div>

  <!-- الشاشة 2: الشخصيات الكرتونية بالحقائب النفاثة والقبعات البيضاء -->
  <div id="warningOverlay" class="overlay" style="display: none;">
    <h1>تحذير من الفريق الطبي! ⚠️</h1>
    <div class="jetpack-container">
      <canvas id="char1Canvas" width="120" height="120"></canvas>
      <canvas id="char2Canvas" width="120" height="120"></canvas>
    </div>
    <p>احذر! الطريق مليء بالفيروسات والأجسام الغريبة.<br>اقفز لتفاديها واجمع طاقة الـ ATP للوصول بسلام!</p>
    <button id="goGameBtn" type="button" style="font-size: 22px; background: #00b894; box-shadow: 0 4px 0 #006b54;">انطلق الآن! 🚀</button>
  </div>

  <!-- الشاشة 3: نهاية المحاولة -->
  <div id="gameOverOverlay" class="overlay" style="display: none;">
    <h1>انتهت المحاولة!</h1>
    <p id="goScore" style="font-size: 24px; color: #ffde59;"></p>
    <button id="restartBtn" type="button" style="font-size: 22px;">إعادة اللعب 🔄</button>
  </div>
</div>

<script>
const cv = document.getElementById('c');
const g = cv.getContext('2d');

let W = cv.width = window.innerWidth;
let H = cv.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
});

let mute = false;
let AC = null;
function sound(f, d, ty='square') {
  if (mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), n = AC.createGain(), a = AC.currentTime;
    o.type = ty; o.frequency.value = f;
    n.gain.setValueAtTime(0.05, a);
    n.gain.exponentialRampToValueAtTime(0.001, a + d);
    o.connect(n); o.connect(AC.destination);
    o.start(); o.stop(a + d);
  } catch (e) {}
}

let gameState = 'START';
let score = 0, lives = 3, frameCount = 0, isPaused = false;
const groundY = () => H * 0.78;

const player = { x: 100, y: 0, w: 50, h: 65, vy: 0, gravity: 0.65, jumpPower: -14, isGrounded: false };
let obstacles = [], collectibles = [];

// رسم الشخصيات بالحقائب النفاثة
function drawJetpackCharacter(ctx, x, y, isGirl = false) {
  ctx.save();
  ctx.translate(x, y);

  // نار الحقيبة
  ctx.fillStyle = Math.random() > 0.5 ? '#ff7675' : '#fdcb6e';
  ctx.beginPath();
  ctx.moveTo(-20, 15); ctx.lineTo(-14, 32 + Math.random()*8); ctx.lineTo(-8, 15);
  ctx.fill();

  // الحقيبة النفاثة
  ctx.fillStyle = '#7f8c8d'; ctx.fillRect(-22, -10, 12, 26);
  ctx.fillStyle = '#bdc3c7'; ctx.fillRect(-20, -6, 8, 18);

  // الجسم
  ctx.fillStyle = isGirl ? '#e84393' : '#0984e3';
  ctx.beginPath(); ctx.roundRect(-8, -10, 22, 26, 6); ctx.fill();

  // الرأس
  ctx.fillStyle = '#ffeaa7';
  ctx.beginPath(); ctx.arc(3, -20, 13, 0, Math.PI * 2); ctx.fill();

  // القبعة البيضاء
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(3, -25, 14, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillRect(-11, -27, 28, 4);

  // العيون والابتسامة
  ctx.fillStyle = '#2d3436';
  ctx.beginPath();
  ctx.arc(7, -20, 2, 0, Math.PI * 2);
  ctx.arc(12, -20, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath(); ctx.arc(9, -16, 3.5, 0, Math.PI); ctx.stroke();
  ctx.restore();
}

function renderWarningChars() {
  const c1 = document.getElementById('char1Canvas').getContext('2d');
  const c2 = document.getElementById('char2Canvas').getContext('2d');
  c1.clearRect(0, 0, 120, 120); c2.clearRect(0, 0, 120, 120);
  drawJetpackCharacter(c1, 60, 65, false);
  drawJetpackCharacter(c2, 60, 65, true);
}

// أزرار التحكم بالنقر المباشر
document.getElementById('startBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('warningOverlay').style.display = 'flex';
  renderWarningChars();
  gameState = 'WARNING';
});

document.getElementById('goGameBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('warningOverlay').style.display = 'none';
  startGame();
});

document.getElementById('restartBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('gameOverOverlay').style.display = 'none';
  startGame();
});

document.getElementById('pBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (gameState !== 'PLAYING') return;
  isPaused = !isPaused;
  document.getElementById('pBtn').innerText = isPaused ? 'استئناف' : 'إيقاف';
});

document.getElementById('mBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  mute = !mute;
  document.getElementById('mBtn').innerText = mute ? 'الصوت: مكتوم' : 'الصوت: مفعل';
});

function startGame() {
  score = 0; lives = 3; gameState = 'PLAYING'; isPaused = false;
  player.y = groundY() - player.h; player.vy = 0;
  obstacles = []; collectibles = [];
  obstacles.push({ x: W + 350, y: groundY() - 45, w: 45, h: 45 });
}

function doJump() {
  if (gameState === 'PLAYING' && player.isGrounded && !isPaused) {
    player.vy = player.jumpPower; player.isGrounded = false;
    sound(450, 0.1, 'sine');
  }
}

// القفز بالنقر على الشاشة أثناء اللعب فقط
window.addEventListener('keydown', (e) => { 
  if (e.code === 'Space' || e.code === 'ArrowUp') doJump(); 
});

cv.addEventListener('pointerdown', (e) => {
  doJump();
});

function update() {
  if (gameState !== 'PLAYING' || isPaused) return;
  frameCount++;

  player.vy += player.gravity;
  player.y += player.vy;
  if (player.y + player.h >= groundY()) {
    player.y = groundY() - player.h; player.
